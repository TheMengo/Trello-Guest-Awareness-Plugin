<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trello Guest Awareness deterministic fixture</title>
<style>
:root {color-scheme: light dark; font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;background:#e9f2ff}*{box-sizing:border-box}body{margin:0}header{padding:12px 20px;background:#0747a6;color:white;display:flex;gap:12px;flex-wrap:wrap;align-items:center}h1{font-size:18px;margin:0}main{padding:24px}.window{max-width:740px;margin:20px auto;padding:24px;border-radius:12px;background:#fff;box-shadow:0 8px 40px #091e4230}.window h2{margin-top:0;font-size:22px}button,a{font:inherit}button{padding:8px 12px;border:1px solid #8590a2;border-radius:4px;cursor:pointer}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #0c66e4;outline-offset:3px}textarea{font:inherit;display:block;width:100%;min-height:100px;padding:12px;margin:12px 0}button:disabled{cursor:default;opacity:.5}.activities{margin-top:24px}.card-controls{display:flex;gap:8px;flex-wrap:wrap}.comment{white-space:pre-wrap;padding:8px;border-bottom:1px solid #dcdfe4}label{display:block}.atMention{background:#e9f2ff;color:#0055cc}html[data-theme=dark]{background:#101b2d;color:#b6c2cf}html[data-theme=dark] .window{background:#22272b;color:#b6c2cf}html[data-theme=dark] header{background:#1d2125}@media(max-width:440px){main{padding:8px}.window{padding:16px;margin-top:8px}}
</style></head><body>
<header data-testid="board-header"><h1>Product delivery</h1><nav aria-label="Test board navigation"><button id="board-one">Board one</button> <button id="board-two">Board two</button></nav></header>
<main><div class="card-controls"><button id="open-first">Open card</button><button id="open-second">Next card</button><button id="close-card">Close card</button><button id="toggle-theme">Toggle theme</button></div><div id="card-mount"></div></main>
<script>
window.fixture={comments:[],submissions:0,card:'CaRd1234',board:'AbCd1234',keyboardEvents:0};
const richEditor=new URLSearchParams(location.search).get('editor')==='contenteditable';
const asyncSubmission=new URLSearchParams(location.search).get('submission')==='async';
const editorMarkup=()=>richEditor?'<div id="comment" role="textbox" aria-label="Write a comment" data-testid="card-comment-input" contenteditable="true" style="min-height:100px;padding:12px;border:1px solid #8590a2;margin:12px 0"></div>':'<textarea id="comment" placeholder="Write a comment…" aria-label="Write a comment"></textarea>';
const cardMarkup=()=>`<section data-testid="card-detail-window" class="window" aria-label="Card detail"><h2>Prepare product release</h2><form data-testid="card-comment-form"><label for="comment">Write a comment</label><div data-testid="card-comment-input" class="comment-box">${editorMarkup()}</div><button type="${asyncSubmission?'button':'submit'}" class="js-add-comment" data-testid="card-comment-save-button" disabled>Save</button></form><section class="activities" aria-label="Previous comments"><h3>Activity</h3><div id="fixture-history"></div><div id="posted-comments"></div></section></section>`;
function render(){document.querySelector('#card-mount').innerHTML=window.fixture.card?cardMarkup():'';if(!window.fixture.card)return;const editor=document.querySelector('#comment');const draft=()=>richEditor?editor.innerText:editor.value;const form=document.querySelector('form');const save=form.querySelector('button');if(asyncSubmission)save.addEventListener('click',()=>{if(draft().trim())setTimeout(()=>{if(form.isConnected)form.requestSubmit()},40)});editor.addEventListener('input',()=>{save.disabled=!draft().trim()});editor.addEventListener('keydown',e=>{window.fixture.keyboardEvents++;if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(draft().trim())form.requestSubmit(save.type==='submit'?save:undefined)}});form.addEventListener('submit',e=>{e.preventDefault();if(!draft().trim())return;window.fixture.submissions++;window.fixture.comments.push({text:draft(),card:window.fixture.card,board:window.fixture.board});const p=document.createElement('p');p.className='comment';p.textContent=draft();document.querySelector('#posted-comments').append(p);if(richEditor)editor.innerText='';else editor.value='';editor.dispatchEvent(new Event('input',{bubbles:true}));});}
function navigate(board,card){window.fixture.board=board;window.fixture.card=card;history.pushState({},'',card?`/c/${card}/prepare-product-release`:`/b/${board}/product-delivery`);document.querySelector('h1').textContent=board==='BoArd002'?'Operations':'Product delivery';render();}
window.fixture.navigate=navigate;
window.fixture.navigateDelayed=(board,card,delay=600)=>{window.fixture.board=board;window.fixture.card=card;history.pushState({},'',card?`/c/${card}/retained-editor`:`/b/${board}/delayed-board`);setTimeout(render,delay)};
window.fixture.setHistory=(id)=>{const history=document.querySelector('#fixture-history');history.innerHTML='';if(!id)return;const p=document.createElement('p');p.dataset.testid='card-comment';p.className='comment';const mention=document.createElement('a');mention.className='atMention';mention.dataset.memberId=id;mention.dataset.id=id;mention.href='/guest_alex';mention.textContent='@guest_alex';p.append(mention,' Please review the earlier draft.');history.append(p);};
document.querySelector('#open-first').onclick=()=>navigate('AbCd1234','CaRd1234');document.querySelector('#open-second').onclick=()=>navigate('AbCd1234','CaRd5678');document.querySelector('#close-card').onclick=()=>navigate(window.fixture.board,null);document.querySelector('#board-one').onclick=()=>navigate('AbCd1234',null);document.querySelector('#board-two').onclick=()=>navigate('BoArd002',null);document.querySelector('#toggle-theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
window.addEventListener('popstate',()=>{const m=location.pathname.match(/^\/(b|c)\/([^/]+)/);if(m){if(m[1]==='b'){window.fixture.board=m[2];window.fixture.card=null}else window.fixture.card=m[2]}render()});
const m=location.pathname.match(/^\/(b|c)\/([^/]+)/);if(m){if(m[1]==='b'){window.fixture.board=m[2];window.fixture.card=null}else window.fixture.card=m[2]}render();
</script></body></html>
